<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#e9e4d8}canvas{display:block}</style>

<body><script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
const q = new URLSearchParams(location.search)
const W = +q.get('w') || 600, H = +q.get('h') || 800
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(W, H); renderer.setPixelRatio(1)
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9e4d8')
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
const key = new THREE.DirectionalLight('#fff4e0', 2.2); key.position.set(3, 6, 4); scene.add(key)
const fill = new THREE.DirectionalLight('#dbe8ff', 0.8); fill.position.set(-4, 3, -2); scene.add(fill)
const cam = new THREE.PerspectiveCamera(32, W / H, 0.01, 100)
const root = new THREE.Group(); scene.add(root)
const ground = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: '#d9d2c2', roughness: 1 })); ground.rotation.x = -Math.PI / 2; scene.add(ground)
window.ready = false; window.info = {}
let mixer = null
new GLTFLoader().load(q.get('glb'), (g) => {
  const m = g.scene; root.add(m)
  if (q.get('anim') && g.animations.length) { mixer = new THREE.AnimationMixer(m); mixer.clipAction(g.animations[0]).play(); mixer.setTime(+q.get('anim')) }
  const box = new THREE.Box3().setFromObject(m); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3())
  m.position.sub(c); m.position.y += size.y / 2 // feet on the ground
  ground.position.y = 0
  const h = size.y; const d = h * 1.9
  cam.position.set(0, h * 0.55, d); cam.lookAt(0, h * 0.5, 0)
  let tris = 0; m.traverse((o) => { if (o.isMesh) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 } })
  window.info = { size: [size.x, size.y, size.z], tris }
  window.ready = true
})
window.setAngle = (deg) => { root.rotation.y = deg * Math.PI / 180; renderer.render(scene, cam) }
</script></body></html>
